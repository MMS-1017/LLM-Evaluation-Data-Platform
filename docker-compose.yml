# LLM Evaluation Data Platform — Docker Compose
#
# Starts the full local development stack:
#   - qdrant:   vector database (http://localhost:6333)
#   - mlflow:   experiment tracking UI (http://localhost:5000)
#   - api:      FastAPI RAG service      (http://localhost:8000)
#
# Usage:
#   docker compose up -d          # start all services in background
#   docker compose logs -f api    # tail API logs
#   docker compose down           # stop and remove containers
#
# Prerequisites:
#   docker compose build          # build the api image first
#
# Note: The api service only starts successfully after running the full
# ingestion + embedding pipeline so that Qdrant has data to serve.

version: "3.9"

services:
  # ── Qdrant vector store ────────────────────────────────────────────────────
  qdrant:
    image: qdrant/qdrant:v1.9.3
    container_name: llm_eval_qdrant
    restart: unless-stopped
    ports:
      - "6333:6333"   # REST API
      - "6334:6334"   # gRPC
    volumes:
      - qdrant_storage:/qdrant/storage
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:6333/healthz"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ── MLflow tracking server ─────────────────────────────────────────────────
  mlflow:
    image: ghcr.io/mlflow/mlflow:v2.13.2
    container_name: llm_eval_mlflow
    restart: unless-stopped
    ports:
      - "5000:5000"
    volumes:
      - mlflow_data:/mlflow
    command: >
      mlflow server
        --host 0.0.0.0
        --port 5000
        --backend-store-uri sqlite:///mlflow/mlflow.db
        --default-artifact-root /mlflow/artifacts
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 15s

  # ── FastAPI RAG service ────────────────────────────────────────────────────
  api:
    build:
      context: .
      dockerfile: docker/Dockerfile.api
    container_name: llm_eval_api
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      # Override service addresses to point at Docker network names
      QDRANT_HOST: qdrant
      QDRANT_PORT: 6333
      MLFLOW_TRACKING_URI: http://mlflow:5000
    volumes:
      # Mount data directory so the API can read pre-built Gold layer
      - ./data:/app/data:ro
      - api_logs:/app/logs
    depends_on:
      qdrant:
        condition: service_healthy
      mlflow:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

volumes:
  qdrant_storage:
    driver: local
  mlflow_data:
    driver: local
  api_logs:
    driver: local
