[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "llm-eval-platform"
version = "0.1.0"
description = "LLM Evaluation Data Platform — Production AI Data Engineering"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "AI Engineering Team" }]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*", "pipelines*", "services*"]

[project.optional-dependencies]
spark = [
    "pyspark==3.5.1",
    "delta-spark==3.1.0",
    "pyarrow>=14.0.0",
    "pandas>=2.0.0",
]
ai = [
    "langchain>=0.2.0",
    "langchain-community>=0.2.0",
    "langchain-openai>=0.1.0",
    "langchain-huggingface>=0.0.3",
    "langchain-core>=0.2.0",
    "sentence-transformers>=3.0.0",
    "qdrant-client>=1.9.0",
    "openai>=1.30.0",
    "transformers>=4.40.0",
    "torch>=2.2.0",
    "datasets>=2.19.0",
]
api = [
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.30.0",
    "python-multipart>=0.0.9",
    "httpx>=0.27.0",
]
eval = [
    "ragas>=0.1.9",
    "mlflow>=2.13.0",
]
config = [
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",
    "python-dotenv>=1.0.0",
    "pyyaml>=6.0.1",
]
logging = [
    "loguru>=0.7.2",
]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.4.0",
    "black>=24.4.0",
    "mypy>=1.10.0",
]
all = [
    "llm-eval-platform[spark,ai,api,eval,config,logging,dev]",
]

# ── Ruff ──────────────────────────────────────────────────────────────────────
[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM"]
ignore = ["E501"]

# ── Black ─────────────────────────────────────────────────────────────────────
[tool.black]
line-length = 100
target-version = ["py311"]

# ── Pytest ────────────────────────────────────────────────────────────────────
[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-v --tb=short"
markers = [
    "integration: marks tests that require external services (Qdrant, Spark)",
    "unit: marks fast, dependency-free unit tests",
]

# ── MyPy ──────────────────────────────────────────────────────────────────────
[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
warn_unused_ignores = true
